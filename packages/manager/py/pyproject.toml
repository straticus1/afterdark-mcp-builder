[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-manager"
version = "2.0.0"
description = "Python wrapper for mcp-manager CLI — manage MCP servers for Claude Code and AI agents"
authors = [{ name = "dwilcox" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
mcpm-py = "mcp_manager.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_manager"]

[tool.mypy]
strict = true
python_version = "3.11"
